<html lang="en">
<head>

<body>
  <main>
    <div id="map" aria-label="Map showing your current location"></div>
    <header><span class="brand-dot"></span><span>Lifeline</span></header>
    <button id="recenter" aria-label="Find my location" title="Find my location">
      <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="m20 4-6 16-3-7-7-3 16-6Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>
    </button>
    <section class="card" aria-label="Confirm your location">
      <div class="card-top"><span class="location-icon"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="12" cy="12" r="4" stroke="currentColor" stroke-width="2"/><path d="M12 2v3m0 14v3M2 12h3m14 0h3" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></span><div><h1 id="title">Your location</h1><p id="status" role="status">Finding you…</p></div></div>
      <button id="confirm" disabled>Confirm location<svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="m5 12 4 4L19 6" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
    </section>
  </main>
